# Maps the user stories in docs/user-scenarios.md to their Figma Design frames,
# following the taxonomy Epic -> Story -> Scenario -> UI. Figma authoring
# convention (keeps this file regenerable with no manual node entry):
#
#   Page:  "<Epic>"                       (pages prefixed "_" are ignored)
#     └─ Section: "<exact story title>"   → story  (the mapping key)
#          ├─ "scenario"                  → scenario
#          ├─ "ui: …"                     → ui[0]  } reading order
#          └─ "ui: …"                     → ui[1]  } (top→bottom, left→right)
#
# Each `ui` entry is { node, shot }: the Figma node id (hyphen form) and the stem
# of the Playwright screenshot — runtime/e2e/__screens__/<epic_dir>/<shot>.png —
# that captures the same state. That pair is what the visual-alignment skill
# (.claude/skills/figma-alignment) compares. `shot: null` means no app screenshot
# (e.g. a design-ahead frame with no runtime equivalent yet). Node ids change
# when frames are rebuilt — re-run the sync to regenerate.

