# Maps each user scenario (docs/user-scenarios.md) to its Figma Design frames.
# Cached so build/QA agents read node IDs from here instead of re-querying the
# Figma MCP every time. This file is also the Step 6 DoD #3 traceability record
# (every scenario <-> frame, both directions).
#
# Fields per scenario:
#   scenario     - exact title from docs/user-scenarios.md
#   description  - Figma node id of the written-scenario / spec frame
#   ui           - Figma node id of the rendered UI mockup frame
# Node ids use Figma's hyphen form (e.g. "28-80"); blanks are TODO.
#
# Scenarios that intentionally have no static frame go under `unmapped_scenarios`
# at the bottom, each with a reason — so the map stays a complete check rather
# than leaving genuine gaps indistinguishable from oversights.

file_key: PhmORZnicz8g3er2ZspqZl
project_name: Surprisal Party

scenarios:

    # Onboarding
    - scenario: "As a first-time visitor, I am shown a one-time primer on surprisal"
      description: "28-78"
      ui: "28-80"

