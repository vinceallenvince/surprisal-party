# Maps the user stories in docs/user-scenarios.md to their Figma Design frames,
# following the taxonomy Epic -> Story -> Scenario -> UI. Figma authoring
# convention (keeps this file regenerable with no manual node entry):
#
#   Page:  "<Epic>"                       (pages prefixed "_" are ignored)
#     └─ Section: "<exact story title>"   → story  (the mapping key)
#          ├─ "scenario"                  → scenario
#          ├─ "ui: …"                     → ui[0]  } reading order
#          └─ "ui: …"                     → ui[1]  } (top→bottom, left→right)
#
# Node ids are Figma's hyphen form and change when frames are rebuilt — re-run
# the sync (read each page via the Figma desktop MCP) to regenerate this file.

