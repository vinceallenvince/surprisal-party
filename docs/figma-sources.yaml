# User scenarios that intentionally have no static Figma frame, with the reason.
# Listed here (rather than omitted) so the scenario <-> frame map stays a complete
# check: a missing entry is an oversight, an entry here is a deliberate exception.
unmapped_scenarios:
    - scenario: "As a user, I see the slider's two regimes reflected in what happens on screen"
      reason: >-
        Inherently dynamic — it describes how behaviour differs across the
        lossless vs lossy range, a comparison over the slider's travel, which no
        single static frame captures. Covered in docs/user-scenarios.md and
        docs/implementation-plan.md instead.
